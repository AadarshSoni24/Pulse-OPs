name: PulseOps Backend CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pulseops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check TypeScript Compilation
        run: npm run lint

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma Database Migrations
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/pulseops_test?schema=public"
        run: npx prisma db push

      - name: Execute Automated Test Suite
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/pulseops_test?schema=public"
          REDIS_URL: "redis://127.0.0.1:6379"
          JWT_ACCESS_SECRET: "ci-testing-secret-access"
          JWT_REFRESH_SECRET: "ci-testing-secret-refresh"
        run: npm test

      - name: Build Application Bundle
        run: npm run build

      - name: Build Docker Container Image
        run: docker build -t pulseops-backend:latest .
