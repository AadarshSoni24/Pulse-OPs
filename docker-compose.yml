version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulseops-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pulseops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pulseops-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: pulseops-api
    restart: always
    command: npm start
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/pulseops?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_ACCESS_SECRET: "prod-access-secret-pulseops"
      JWT_REFRESH_SECRET: "prod-refresh-secret-pulseops"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-health:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: pulseops-health-worker
    restart: always
    command: npm run worker:health
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/pulseops?schema=public"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: pulseops-scheduler-worker
    restart: always
    command: npm run worker:scheduler
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/pulseops?schema=public"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
